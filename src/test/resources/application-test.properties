spring.application.name=back_resto

# Base de donnees H2 en mémoire pour les tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration JPA/Hibernate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Configuration du serveur
server.port=0

#JWT
app.secret-key=test-secret-key-for-testing-purposes-only-very-long-key-required
app.access-token-expiration=3600
app.refresh-token-expiration=86400

