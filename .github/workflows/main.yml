name: CI/CD Back Resto

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./back

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # On met en cache les dépendances

      - name: Build and Test with Maven
        run: mvn clean verify

      - name: Upload Jacoco Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 1 # Le rapport sera conservé pendant 1 jour après bye bye

    # ... fin du job frontend-test ...

    sonar:
      name: SonarCloud Analysis
      runs-on: ubuntu-latest
      needs: [ backend-test ]

      steps:
        - name: Checkout du code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0  # Important pour que Sonar puisse analyser l'historique git (blame)

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: 21
            distribution: 'zulu'

        # RÉCUPÉRATION DES ARTEFACTS
        # On récupère le rapport Jacoco du job backend
        - name: Download Backend Coverage
          uses: actions/download-artifact@v4
          with:
            name: jacoco-report
            path: back/target/site/jacoco


        # ANALYSE SONARCLOUD
        # Note: On recompile rapidement le back pour avoir les .class (binaries)
        # sinon Sonar risque de se plaindre que l'analyse Java est incomplète.
        # On utilise -DskipTests car les tests ont déjà été faits avant.
        - name: Build classes for Sonar
          run: |
            cd back
            mvn clean compile -DskipTests

        - name: SonarCloud Scan
          uses: SonarSource/sonarcloud-github-action@master
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}