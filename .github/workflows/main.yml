name: CI/CD Back Resto

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # On met en cache les dépendances

      - name: Build and Test with Maven
        run: mvn clean test jacoco:report
        env:
          SPRING_PROFILES_ACTIVE: test
          MAVEN_OPTS: -Xmx2048m -Djdk.attach.allowAttachSelf=true
        continue-on-error: false

      - name: Upload Jacoco Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 1 # Le rapport sera conservé pendant 1 jour après bye bye

    # ... fin du job frontend-test ...

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [ backend-test ]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Backend Coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Build and Analyze with Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B package sonar:sonar \
            -DskipTests \
            -Dsonar.projectKey=EdouardPlantevin_back_resto \
            -Dsonar.organization=edouardplantevin \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml